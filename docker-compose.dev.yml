version: '3.8'

services:
  db:
    # Local Docker Postgres is no longer used by default (the app uses the remote
    # server from .env). Start it only with: docker compose --profile local-db up
    profiles: ["local-db"]
    image: postgres:15
    environment:
      POSTGRES_USER: industrace_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: industrace
    volumes:
      - industrace_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - industrace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrace_user -d industrace"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    # Shared remote database settings (DATABASE_URL, DB_SCHEMA) - same file on local and server.
    # required:false so `make test` (which passes its own DATABASE_URL) works without it.
    env_file:
      - path: .env.db
        required: false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - ENVIRONMENT=development
      - DEBUG=true
      # ENCRYPTION_KEY: Optional in development (temporary key will be generated and saved to logs/.encryption_key_temp)
      # For production, set this to a persistent value:
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # - ENCRYPTION_KEY=your-encryption-key-here
    ports:
      - "8000:8000"
    networks:
      - industrace-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - industrace-network

volumes:
  industrace_postgres_data:

networks:
  industrace-network:
    driver: bridge 